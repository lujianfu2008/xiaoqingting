appId: com.bailongma.desktop
productName: 小蜻蜓
# 安装包文件名用 ASCII，避免中文名在下载/传输环节出问题
artifactName: xqt-setup-${version}.${ext}
electronVersion: 33.4.11
# 安装完成后不自动启动：oneClick 收尾的 StdUtils.ExecShellAsUser 在部分中文
# Windows 上弹「该文件没有与之关联的应用」错误框，改由用户从快捷方式启动。
nsis:
  runAfterFinish: false
directories:
  output: release
files:
  - out/**
  - package.json
  # Only the target platform's sherpa build can load; shipping both adds ~32 MB.
  - "!node_modules/sherpa-onnx-linux-x64/**"
  - "!node_modules/sherpa-onnx-darwin-*/**"
# Local offline ASR: sherpa-onnx reads the Paraformer model from disk, so it
# ships outside the asar. (The old vosk + standalone node.exe runtime is gone —
# asr.ts now loads sherpa-onnx as a NAPI addon inside the main process.)
extraResources:
  - from: models
    to: models
  # Tray icon for 关闭按钮行为=托盘 (main/tray.ts reads resourcesPath/icon.ico).
  - from: build/icon.ico
    to: icon.ico
# sherpa-onnx-node loads its native addon (+ .dll/.so) through plain `require`,
# which cannot read from inside an asar — unpack the whole node_modules tree.
asarUnpack:
  - node_modules/**
win:
  target: nsis
  # 交叉打包要先准备 Windows 原生包（npm 在 Linux 上会按 os 字段拒绝安装）：
  #   npm pack sherpa-onnx-win-x64@1.13.8 && tar xzf ... -C node_modules && \
  #   mv package node_modules/sherpa-onnx-win-x64
  # 图标在 build/icon.ico（多尺寸，从 build/icon.svg 生成）。exe 资源改写
  # （图标/版本信息）在本机直接执行、无需 wine；但它要下载 winCodeSign 工具，
  # GitHub 直连不通，构建时需带镜像环境变量：
  #   ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
  icon: build/icon.ico
mac:
  target: dmg
  category: public.app-category.productivity
  icon: build/icon.png
linux:
  target: AppImage
  category: Utility
  icon: build/icon.png
npmRebuild: false
